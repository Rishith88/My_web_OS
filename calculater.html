<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculater</title>
    <style>
        .container{
            width: 100%;
            height: 100vh;
            background-color: darkslateblue;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .calculater{
            background-color: aquamarine;
            padding: 20px;
            border-radius: 10px;
        }
        .calculater form input{
            border: 0;
            outline: 0;
            border-radius: 10px;
            width: 60px;
            height: 60px;
            box-shadow: -8px -8px 15px rgba(255,255,255,0.3),5px 5px 15px rgba(0, 0, 0, 0.6);
            background: transparent;

        }
        .display{
            display: flex;
            justify-content: flex-end;
            margin: 20px 0;
        }
        .display input{
            text-align: left;
            flex: 1;
            font-size: 45px;
            box-shadow: none;
        }
        .EqualTo input{
            width: 145px;
        }
        .close-btn{
 position: absolute; 
    top: 15px;          
    right: 15px;        
    width: 30px 
    height: 30px 
    border-radius: 50% 
    background-color: rgba(0, 0, 0, 0.1) 
    border: none 
    outline: none 
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    margin: 0 
    color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
                 <input type="button" value="×" onclick="window.location.href='index.html'" class="close-btn" title="Go to Home">

        <div class="calculater">
            <form>
                <div class="display">
                    <input type="text" name="display">
                </div>
                 <div>
                    <input type="button" value="7" onclick="display.value +='7'">
                    <input type="button" value="8" onclick="display.value +='8'">
                    <input type="button" value="9" onclick="display.value +='9'">
                    <input type="button" value="*" onclick="display.value +='*'">
                </div>
                 <div>
                    <input type="button" value="6" onclick="display.value +='6'">
                    <input type="button" value="5" onclick="display.value +='5'">
                    <input type="button" value="4" onclick="display.value +='4'">
                    <input type="button" value="3" onclick="display.value +='3'">
                </div>
                 <div>
                    <input type="button" value="2" onclick="display.value +='2'">
                    <input type="button" value="1" onclick="display.value +='1'">
                    <input type="button" value="0" onclick="display.value +='0'">
                    <input type="button" value="00" onclick="display.value +='00'">
                </div>
                <div>
                    <input type="button" value="AC" onclick="display.value=''">
                    <input type="button" value="Del" onclick="display.value= display.value.toString().slice(0,-1)">
                    <input type="button" value="."  onclick="display.value +='.'">
                    <input type="button" value="/"  onclick="display.value +='/'">
                </div>
                 <div>
                    <input type="button" value="-"  onclick="display.value +='-'">
                    <input type="button" value="+"  onclick="display.value +='+'">
                    <input type="button" value="=" onclick="display.value=eval(display.value)" class="EqualTo">
                    
                </div>
                
               
            </form>
        </div>
    </div>
</body>
</html>
