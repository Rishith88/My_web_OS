<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rishi's Notepad</title>
</head>
<style>
    body{
        background-color: cadetblue;
    }
    h1{
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 70px;
        font-weight: 900;
    }
    p{
        height: 0vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 20px;
        font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
    }
    
    /* New styles added strictly inside the style section */
    .notepad-wrapper {
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        margin-top: 80px; 
        font-family: sans-serif;
    }
    .notepad-textarea {
        width: 80%; 
        max-width: 800px; 
        height: 300px; 
        font-size: 18px; 
        padding: 15px; 
        border-radius: 8px; 
        border: 2px solid #333; 
        box-shadow: 0 4px 10px rgba(0,0,0,0.15); 
        font-family: inherit; 
        resize: vertical; 
        box-sizing: border-box;
    }
    .notepad-btn-container {
        margin-top: 15px; 
        display: flex; 
        gap: 15px; 
        width: 80%; 
        max-width: 800px;
    }
    .btn-save {
        flex: 1; 
        padding: 12px; 
        font-size: 16px; 
        font-weight: bold; 
        background-color: #2e7d32; 
        color: white; 
        border: none; 
        border-radius: 5px; 
        cursor: pointer;
    }
    .btn-clear {
        flex: 1; 
        padding: 12px; 
        font-size: 16px; 
        font-weight: bold; 
        background-color: #d32f2f; 
        color: white; 
        border: none; 
        border-radius: 5px; 
        cursor: pointer;
    }
</style>
<body>
    <h1>Rishi's Notepad</h1>
    <p>You can write whatever you want here</p>

    
    <div class="notepad-wrapper">
        <textarea id="notepadTextarea" class="notepad-textarea" placeholder="Start typing here..."></textarea>
        
        <div class="notepad-btn-container">
            <button class="btn-save" onclick="saveText()">Save Note</button>
            <button class="btn-clear" onclick="clearText()">Clear Text</button>
        </div>
    </div>

    <script>
    
        window.addEventListener('DOMContentLoaded', () => {
            const savedData = localStorage.getItem('rishi_note_data');
            if (savedData) {
                document.getElementById('notepadTextarea').value = savedData;
            }
        });

        
        function saveText() {
            const currentContent = document.getElementById('notepadTextarea').value;
            localStorage.setItem('rishi_note_data', currentContent);
            alert('Note saved successfully!');
        }

        
        function clearText() {
            if (confirm('Are you sure you want to clear your note?')) {
                document.getElementById('notepadTextarea').value = '';
                localStorage.removeItem('rishi_note_data');
            }
        }
    </script>
</body>
</html>
